name: 离线文档 · Astral (ruff / uv / ty)

# 三个仓库共用一套 mkdocs-material 构建流程，差异集中在 scripts/build-astral.sh：
#   ruff —— cargo dev 导出规则页（需要 Rust，约 5-10 分钟）
#   uv   —— cargo dev 生成 CLI/选项/环境变量参考页（需要 Rust，首次约 10-20 分钟）
#   ty   —— 参考页已入库，直接构建（无需 Rust，最快）
#
# ref 支持按项目单独指定：三个仓库发版节奏不同，想固定某个仓库的 tag
# （例如 uv 用 0.9.0 而不跟 main）就填对应的 ruff_ref / uv_ref / ty_ref；
# 留空则回落到公用的 ref。plan job 把「项目 + 各自 ref」拼成矩阵交给 build job。
on:
  workflow_dispatch:
    inputs:
      project:
        description: 构建哪个项目
        type: choice
        options:
          - all
          - ruff
          - uv
          - ty
        default: all
      ref:
        description: 三个仓库的默认 ref（下面留空的项都用它）
        type: string
        default: main
      ruff_ref:
        description: ruff 专用 ref（留空 = 用上面的默认 ref）
        type: string
        default: ''
      uv_ref:
        description: uv 专用 ref（留空 = 用上面的默认 ref）
        type: string
        default: ''
      ty_ref:
        description: ty 专用 ref（留空 = 用上面的默认 ref）
        type: string
        default: ''
      publish_release:
        description: 构建完成后发布到 GitHub Release
        type: boolean
        default: false
  workflow_call:
    inputs:
      project:
        type: string
        default: all
      ref:
        type: string
        default: main
      ruff_ref:
        type: string
        default: ''
      uv_ref:
        type: string
        default: ''
      ty_ref:
        type: string
        default: ''
      publish_release:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: offline-astral-${{ inputs.project }}
  cancel-in-progress: true

jobs:
  plan:
    name: 解析构建矩阵
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      refs: ${{ steps.set.outputs.refs }}
    steps:
      - id: set
        shell: bash
        env:
          PROJECT: ${{ inputs.project }}
          DEFAULT_REF: ${{ inputs.ref }}
          RUFF_REF: ${{ inputs.ruff_ref }}
          UV_REF: ${{ inputs.uv_ref }}
          TY_REF: ${{ inputs.ty_ref }}
        run: |
          set -euo pipefail

          case "$PROJECT" in
            ruff|uv|ty) list="$PROJECT" ;;
            *)          list="ruff uv ty" ;;
          esac

          # 各项目自己的 ref 优先，留空才回落到公用默认值
          ref_for() {
            local proj="$1" override="" ref=""
            case "$proj" in
              ruff) override="${RUFF_REF:-}" ;;
              uv)   override="${UV_REF:-}"   ;;
              ty)   override="${TY_REF:-}"   ;;
            esac
            ref="${override:-${DEFAULT_REF:-}}"
            printf '%s' "${ref:-main}"
          }

          matrix='['
          refs=''
          for p in $list; do
            r="$(ref_for "$p")"
            matrix="$matrix{\"project\":\"$p\",\"ref\":\"$r\"},"
            refs="$refs $p=$r"
          done
          matrix="${matrix%,}]"
          refs="${refs# }"

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "refs=$refs" >> "$GITHUB_OUTPUT"
          echo "构建矩阵: $matrix"

  build:
    name: 构建 ${{ matrix.project }} @ ${{ matrix.ref }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: 检出构建仓库（补丁与脚本）
        uses: actions/checkout@v4
        with:
          path: build-tools

      - name: 检出上游源码
        uses: actions/checkout@v4
        with:
          repository: astral-sh/${{ matrix.project }}
          ref: ${{ matrix.ref }}
          path: src
          # uv/ty 的 git-revision-date 插件需要完整历史；ruff 不需要
          fetch-depth: ${{ matrix.project == 'ruff' && 1 || 0 }}
          submodules: false
          persist-credentials: false

      - name: 应用离线化补丁
        run: bash build-tools/scripts/apply-patches.sh src build-tools/patches/${{ matrix.project }}

      # setup-uv 不发布滚动大版本 tag（v10 / v9 / v8 都不存在，只有 v10.3.3 这类完整版本号），
      # 写成 @v10 会在「解析 action」阶段直接失败：Unable to resolve action ... unable to find version v10。
      # 升级时改这里的完整版本号即可：https://github.com/astral-sh/setup-uv/releases
      - name: 安装 uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: src/uv.lock

      - name: 安装 Rust（ruff / uv 需要）
        if: matrix.project != 'ty'
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物（ruff / uv 需要）
        if: matrix.project != 'ty'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src -> target
          # cargo dev 生成参考页，产物随源码变化而变化
          cache-on-failure: true

      - name: 构建站点
        env:
          # gh-admonitions 会访问 GitHub API，带上 token 提高限额
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash build-tools/scripts/build-astral.sh \
            "${{ matrix.project }}" src "out/${{ matrix.project }}"

      - name: 打包为 zip
        run: |
          mkdir -p dist
          (cd "out/${{ matrix.project }}" && zip -qr "$GITHUB_WORKSPACE/dist/${{ matrix.project }}-offline.zip" .)
          ls -lh dist/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-offline
          path: dist/${{ matrix.project }}-offline.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: 写入构建摘要
        run: |
          {
            echo "### ${{ matrix.project }} 离线文档"
            echo ''
            echo "- 上游 ref: \`${{ matrix.ref }}\`"
            echo "- 产物: \`${{ matrix.project }}-offline.zip\` ($(du -h "dist/${{ matrix.project }}-offline.zip" | cut -f1))"
            echo "- 已关闭 Google Fonts / fathom 统计，外链图片由 privacy 插件本地化"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: 发布 Release
    needs: [plan, build]
    if: inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 汇总产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="astral-offline-$(date -u +%Y%m%d)-${{ github.run_number }}"
          gh release create "$tag" dist/*.zip \
            --title "Astral 离线文档 $tag" \
            --notes "手动触发的离线文档构建。上游 ref: \`${{ needs.plan.outputs.refs }}\`。触发人: @${{ github.actor }}"
          echo "已发布: $tag" >> "$GITHUB_STEP_SUMMARY"
