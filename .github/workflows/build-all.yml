name: 离线文档 · 一键全量

# 一个按钮同时构建多个项目；实际逻辑复用各自的可复用工作流。
# 注意：Astral 的 ruff/uv 需要编译 Rust，全量跑一次大约 20-40 分钟。
on:
  workflow_dispatch:
    inputs:
      lang:
        description: vLLM Ascend 语言
        type: choice
        options: [zh, en, both]
        default: zh
      site:
        description: vLLM Recipes 站点
        type: choice
        options: [all, mkdocs, next]
        default: all
      astral:
        description: Astral 文档（ruff / uv / ty）
        type: choice
        options: [all, ruff, uv, ty, none]
        default: all
      litellm:
        description: LiteLLM 文档（Docusaurus）
        type: boolean
        default: true
      vllm_omni:
        description: vLLM-Omni 文档（MkDocs）
        type: boolean
        default: true
      ref_vllm_ascend:
        description: vllm-ascend 上游 ref
        type: string
        default: main
      ref_recipes:
        description: recipes 上游 ref
        type: string
        default: main
      ref_astral:
        description: astral 三个仓库共用的上游 ref
        type: string
        default: main
      ref_pi:
        description: Pi 文档上游 ref
        type: string
        default: master
      ref_litellm:
        description: litellm-docs 上游 ref
        type: string
        default: main
      ref_vllm_omni:
        description: vllm-omni 上游 ref
        type: string
        default: main
      publish_release:
        description: 构建完成后发布到 GitHub Release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: offline-docs-all
  cancel-in-progress: false

jobs:
  vllm-ascend:
    name: vLLM Ascend
    uses: ./.github/workflows/build-vllm-ascend.yml
    with:
      lang: ${{ inputs.lang }}
      ref: ${{ inputs.ref_vllm_ascend }}
      publish_release: ${{ inputs.publish_release }}

  recipes:
    name: vLLM Recipes
    uses: ./.github/workflows/build-recipes.yml
    with:
      site: ${{ inputs.site }}
      ref: ${{ inputs.ref_recipes }}
      publish_release: ${{ inputs.publish_release }}

  astral:
    name: Astral
    if: inputs.astral != 'none'
    uses: ./.github/workflows/build-astral.yml
    with:
      project: ${{ inputs.astral }}
      ref: ${{ inputs.ref_astral }}
      publish_release: ${{ inputs.publish_release }}

  pi:
    name: Pi 文档
    uses: ./.github/workflows/build-pi.yml
    with:
      ref: ${{ inputs.ref_pi }}
      publish_release: ${{ inputs.publish_release }}

  litellm:
    name: LiteLLM
    if: inputs.litellm
    uses: ./.github/workflows/build-litellm.yml
    with:
      ref: ${{ inputs.ref_litellm }}
      publish_release: ${{ inputs.publish_release }}

  vllm-omni:
    name: vLLM-Omni
    if: inputs.vllm_omni
    uses: ./.github/workflows/build-vllm-omni.yml
    with:
      ref: ${{ inputs.ref_vllm_omni }}
      publish_release: ${{ inputs.publish_release }}
